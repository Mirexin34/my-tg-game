<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Арена смерти</title>
    <!-- Подключение к Telegram (которое я забыл) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Принудительно растягиваем на весь экран и красим шапку в цвет игры, чтобы убрать границу
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.setHeaderColor('#1e1e24');
        window.Telegram.WebApp.setBackgroundColor('#1e1e24');
    </script>
</head>
<body>
    <div id="app">
        <canvas id="gameCanvas"></canvas>
        <div id="joystickZone">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
        </div>
        
        <div id="mainMenu">
            <h1>ВЫБЕРИ ГЕРОЯ</h1>
            <button class="heroBtn" id="btnTank">
                ТАНК
                <span>Медленный, 10 Жизней</span>
            </button>
            <button class="heroBtn" id="btnAssassin">
                УБИЙЦА
                <span>Быстрый, Пулемет, 3 Жизни</span>
            </button>
        </div>

        <div id="levelUpScreen">
            <h2>ВЫБЕРИ УЛУЧШЕНИЕ</h2>
            <div id="perksContainer"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
